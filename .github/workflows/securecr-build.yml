name: SecureCR build (Windows alpha)

on:
  push:
    branches: [securecr]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_TRIPLET: x64-windows-static

jobs:
  build-windows:
    name: Build SecureCR Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: securecr-windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (manifest mode)
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ env.VCPKG_TRIPLET }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do
              echo "$f:"; echo "======"; cat "$f"; echo "======"
            done
            exit 1
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch version + rotate ed25519/relay in hbb_common
        shell: bash
        run: |
          set -e
          VERSION="0.1.0-alpha+${GITHUB_RUN_NUMBER}"
          echo "Building SecureCR ${VERSION}"
          echo "SECURECR_VERSION=${VERSION}" >> $GITHUB_ENV
          CONFIG="libs/hbb_common/src/config.rs"
          sed -i 's|RENDEZVOUS_SERVERS: &\[&str\] = &\["rs-ny.rustdesk.com"\]|RENDEZVOUS_SERVERS: \&[\&str] = \&["relay.prvdropshipping.com"]|' "$CONFIG"
          sed -i 's|RS_PUB_KEY: &str = "OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw="|RS_PUB_KEY: \&str = "1HIrAIdfBB26nRhzt9CVXX21St0jjpEyAYNQws1+ZDo="|' "$CONFIG"
          echo "Verifying patched config.rs:"
          grep -E "RS_PUB_KEY|RENDEZVOUS_SERVERS" "$CONFIG" | head -2

      - name: Build SecureCR (via upstream build.py)
        shell: pwsh
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./securecr

      - name: Fetch IDD driver for Privacy Mode
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe","usbmmidd_v2\deviceinstaller.exe","usbmmidd_v2\usbmmidd.bat" -ErrorAction SilentlyContinue
          mv -Force .\usbmmidd_v2 ./securecr

      - name: Rename binary to SecureCR.exe
        shell: pwsh
        run: |
          if (Test-Path "./securecr/rustdesk.exe") {
            Rename-Item -Path "./securecr/rustdesk.exe" -NewName "SecureCR.exe"
          }
          Get-ChildItem ./securecr | Select-Object Name,Length | Format-Table

      - name: Package portable zip
        shell: pwsh
        run: |
          $zip = "SecureCR-${env:SECURECR_VERSION}-windows-x86_64.zip"
          Compress-Archive -Path "./securecr/*" -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureCR-windows-x86_64
          path: SecureCR-*.zip
          retention-days: 30

      - name: Create/Update GitHub Release (alpha channel)
        if: github.ref == 'refs/heads/securecr'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-${{ github.run_number }}
          name: SecureCR alpha ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: SecureCR-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
